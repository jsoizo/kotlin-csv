name: Publish SNAPSHOT

on:
  push:
    branches:
      - version_2_0_0
  workflow_dispatch:

concurrency:
  group: publish-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish SNAPSHOT to Central Portal
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Verify version is SNAPSHOT
        run: |
          VERSION=$(./gradlew -q properties | awk '/^version:/ {print $2}')
          echo "Detected version: $VERSION"
          case "$VERSION" in
            *-SNAPSHOT) echo "ok" ;;
            *) echo "Version $VERSION is not a SNAPSHOT. Aborting." >&2; exit 1 ;;
          esac

      - name: Run checks
        run: ./gradlew clean check

      - name: Publish to Central Portal Snapshots
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew publishToMavenCentral
